<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../output.css" />
    <title>Dictionary game</title>
    <style>
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }
      .shake {
        animation: shake 0.4s ease-in-out;
      }
    </style>
  </head>
  <body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
    <main class="card w-full max-w-xl bg-base-100 shadow-xl">
      <div class="card-body items-center gap-6">
        <!-- Yuqori panel: so'z raqami va ball -->
        <div class="flex w-full items-center justify-between">
          <span id="progress-badge" class="badge badge-warning badge-outline">
            So'z 1/1
          </span>
          <span id="score-badge" class="badge badge-success badge-outline">
            ✓ 0
          </span>
        </div>

        <!-- Tarjima -->
        <div class="text-center">
          <p class="text-xs uppercase tracking-widest opacity-60">
            Inglizcha yozing
          </p>
          <h2
            id="word-meaning"
            class="text-3xl sm:text-4xl font-extrabold text-primary mt-1"
          >
            yuklanmoqda...
          </h2>
        </div>

        <!-- Harf katakchalari -->
        <div
          id="word-boxes"
          class="flex flex-wrap items-center justify-center gap-2 min-h-14"
        >
          <input
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            class="absolute opacity-0 w-0 h-0 pointer-events-none"
          />
        </div>

        <!-- Xabar -->
        <p id="message" class="h-5 text-sm font-semibold"></p>

        <!-- Kichik taymer (pastda) -->
        <div class="flex w-full max-w-xs items-center gap-3">
          <progress
            id="timer-bar"
            class="progress progress-warning h-2 flex-1"
            value="15"
            max="15"
          ></progress>
          <span id="timer" class="w-8 text-right text-xs font-bold opacity-70">
            15s
          </span>
        </div>
      </div>
    </main>

    <script src="../js/game.js" type="module"></script>
  </body>
</html>
