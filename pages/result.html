<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../output.css" />
    <title>Natija | Dictionary game</title>
    <style>
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.97);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .pop-in {
        animation: pop-in 0.5s ease-out both;
      }
      .pop-in-2 {
        animation: pop-in 0.5s ease-out 0.15s both;
      }
      .pop-in-3 {
        animation: pop-in 0.5s ease-out 0.3s both;
      }
      #ring-progress {
        transition: stroke-dashoffset 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      }
    </style>
  </head>
  <body class="bg-base-200 min-h-screen flex items-center justify-center p-4">
    <main class="card w-full max-w-xl bg-base-100 shadow-xl overflow-hidden">
      <!-- Tepa rangli chiziq -->
      <div
        class="h-2 w-full bg-linear-to-r from-warning via-primary to-success"
      ></div>

      <div class="card-body items-center gap-6">
        <!-- Sarlavha -->
        <div class="text-center pop-in">
          <div id="emoji" class="text-5xl mb-2">🏁</div>
          <h1 id="title" class="text-3xl font-extrabold">O'yin tugadi!</h1>
          <p id="subtitle" class="text-sm opacity-60 mt-1"></p>
          <p
            id="incomplete-note"
            class="hidden badge badge-warning badge-outline mt-2"
          >
            Test to'liq tugatilmadi, natija aniq emas
          </p>
        </div>

        <!-- Aylana progress -->
        <div class="relative w-44 h-44 pop-in-2">
          <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
            <circle
              cx="60"
              cy="60"
              r="52"
              fill="none"
              stroke="currentColor"
              stroke-width="10"
              class="opacity-10"
            />
            <circle
              id="ring-progress"
              cx="60"
              cy="60"
              r="52"
              fill="none"
              stroke="currentColor"
              stroke-width="10"
              stroke-linecap="round"
              class="text-warning"
              stroke-dasharray="326.73"
              stroke-dashoffset="326.73"
            />
          </svg>
          <div
            class="absolute inset-0 flex flex-col items-center justify-center"
          >
            <span id="percent" class="text-4xl font-extrabold">0%</span>
            <span class="text-xs uppercase tracking-widest opacity-60"
              >aniqlik</span
            >
          </div>
        </div>

        <!-- Statistika -->
        <div class="grid grid-cols-3 gap-3 w-full pop-in-2">
          <div class="rounded-2xl bg-success/10 p-3 text-center">
            <p class="text-xs uppercase tracking-wider opacity-60">Topildi</p>
            <p id="stat-score" class="text-2xl font-extrabold text-success">
              0
            </p>
          </div>
          <div class="rounded-2xl bg-error/10 p-3 text-center">
            <p class="text-xs uppercase tracking-wider opacity-60">Xato</p>
            <p id="stat-wrong" class="text-2xl font-extrabold text-error">0</p>
          </div>
          <div class="rounded-2xl bg-warning/10 p-3 text-center">
            <p class="text-xs uppercase tracking-wider opacity-60">O'rtacha</p>
            <p id="stat-time" class="text-2xl font-extrabold text-warning">
              0s
            </p>
          </div>
        </div>

        <!-- Taxminiy daraja -->
        <div
          class="w-full rounded-2xl border border-base-300 bg-base-200/60 p-4 pop-in-3"
        >
          <div class="flex items-center gap-4">
            <div
              id="level-badge"
              class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl bg-primary text-2xl font-extrabold text-primary-content"
            >
              —
            </div>
            <div class="min-w-0">
              <p class="text-xs uppercase tracking-widest opacity-60">
                Taxminiy darajangiz
              </p>
              <p id="level-name" class="text-lg font-bold">—</p>
              <p id="level-desc" class="text-sm opacity-70"></p>
            </div>
          </div>
          <p class="mt-3 text-xs opacity-60">
            Tanlangan daraja:
            <span id="selected-levels" class="font-semibold"></span>
          </p>
        </div>

        <!-- Tugmalar -->
        <div class="flex w-full flex-col gap-3 sm:flex-row pop-in-3">
          <button id="restart-btn" class="btn btn-warning flex-1">
            🔄 Qayta boshlash
          </button>
          <button id="new-game-btn" class="btn btn-outline btn-primary flex-1">
            🎮 Yangi o'yin
          </button>
        </div>
      </div>
    </main>

    <script src="../js/result.js" type="module"></script>
  </body>
</html>
